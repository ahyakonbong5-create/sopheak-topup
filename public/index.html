<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopheak Top Up</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #070b14;
  color: #fff;
}

header {
  padding: 18px 20px;
  border-bottom: 1px solid #20283a;
  background: #0b1020;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 21px;
  font-weight: 900;
  color: #62a8ff;
}

.container {
  width: min(1100px, 92%);
  margin: auto;
  padding: 30px 0 60px;
}

.hero {
  padding: 25px 0;
}

.hero h1 {
  font-size: clamp(32px, 7vw, 58px);
  margin: 0 0 12px;
}

.hero p {
  color: #8e9ab2;
}

.search {
  width: 100%;
  padding: 15px 17px;
  border: 1px solid #273149;
  border-radius: 14px;
  background: #101726;
  color: white;
  outline: none;
  font-size: 16px;
  margin: 15px 0 25px;
}

.section-title {
  margin: 25px 0 14px;
  font-size: 20px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}

.game {
  padding: 18px;
  background: #101726;
  border: 1px solid #273149;
  border-radius: 16px;
  cursor: pointer;
  transition: .2s;
}

.game:hover,
.game.active {
  border-color: #4d9cff;
  background: #121e35;
  transform: translateY(-2px);
}

.game-icon {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: #18243b;
  font-size: 27px;
  margin-bottom: 12px;
}

.game-name {
  font-weight: 700;
}

.game-currency {
  color: #7f8ba2;
  font-size: 13px;
  margin-top: 5px;
}

.packages {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
}

.package {
  padding: 18px;
  border-radius: 15px;
  border: 1px solid #273149;
  background: #101726;
  cursor: pointer;
}

.package:hover,
.package.active {
  border-color: #4d9cff;
  background: #121e35;
}

.package-name {
  font-size: 18px;
  font-weight: 800;
}

.price {
  color: #64a9ff;
  margin-top: 8px;
  font-weight: 800;
}

.form {
  margin-top: 25px;
  padding: 20px;
  background: #101726;
  border: 1px solid #273149;
  border-radius: 18px;
}

.input {
  width: 100%;
  padding: 14px;
  margin: 7px 0 12px;
  border: 1px solid #29334a;
  border-radius: 12px;
  background: #0b111e;
  color: white;
  font-size: 16px;
  outline: none;
}

.button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 13px;
  background: #4d9cff;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.button:disabled {
  opacity: .5;
}

.summary {
  margin-top: 20px;
  padding: 18px;
  background: #0b111e;
  border-radius: 14px;
  border: 1px solid #273149;
  display: none;
}

.result {
  margin-top: 18px;
  padding: 18px;
  background: #0d1829;
  border: 1px solid #245b91;
  border-radius: 14px;
  display: none;
}

.muted {
  color: #8793a9;
}

.error {
  color: #ff7272;
  margin-top: 12px;
}

.loading {
  color: #8fa1bd;
  padding: 20px 0;
}

footer {
  text-align: center;
  padding: 25px;
  color: #66738c;
  border-top: 1px solid #20283a;
}

@media(max-width:600px) {
  .container {
    width: 94%;
  }

  .games {
    grid-template-columns: repeat(2, 1fr);
  }

  .packages {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style></head><body><header>
  <div class="logo">⚡ SOPHEAK TOP UP</div>
</header><main class="container">  <section class="hero">
    <h1>Game Top Up<br>Fast & Simple.</h1>
    <p>Select your game, choose a package and create your order.</p>
  </section><input
id="search"
class="search"
type="search"
placeholder="🔎 Search game..."

«»

  <h2 class="section-title">Select Game</h2>  <div id="games" class="games">
    <div class="loading">Loading games...</div>
  </div>  <h2 class="section-title">Select Package</h2>  <div id="packages" class="packages">
    <div class="muted">Select a game first.</div>
  </div>  <div class="form"><h2>Player Information</h2>

<label>Player ID</label>
<input
  id="playerId"
  class="input"
  placeholder="Enter Player ID"
>

<label>Server ID <span class="muted">(optional)</span></label>
<input
  id="serverId"
  class="input"
  placeholder="Enter Server ID"
>

<div id="summary" class="summary"></div>

<button id="orderBtn" class="button" disabled>
  Create Order
</button>

<div id="error" class="error"></div>

<div id="result" class="result"></div>

  </div></main><footer>
  © 2026 Sopheak Top Up
</footer><script>

const API = "/api";

let gamesData = {};
let selectedGame = null;
let selectedProduct = null;

const gamesEl = document.getElementById("games");
const packagesEl = document.getElementById("packages");
const searchEl = document.getElementById("search");
const playerEl = document.getElementById("playerId");
const serverEl = document.getElementById("serverId");
const orderBtn = document.getElementById("orderBtn");
const summaryEl = document.getElementById("summary");
const resultEl = document.getElementById("result");
const errorEl = document.getElementById("error");


function gameIcon(name) {

  const icons = {
    "Mobile Legends": "⚔️",
    "Free Fire": "🔥",
    "PUBG Mobile": "🔫",
    "Call of Duty Mobile": "🎯"
  };

  return icons[name] || "🎮";
}


function formatPrice(price) {

  return Number(price).toLocaleString("en-US") + "៛";
}


async function loadGames() {

  try {

    const response =
      await fetch(`${API}/prices`);

    const data =
      await response.json();

    if (!data.success) {
      throw new Error("API error");
    }

    gamesData = data.games;

    renderGames();

  } catch (error) {

    gamesEl.innerHTML =
      `<div class="error">
        Failed to load games.
      </div>`;

    console.error(error);
  }
}


function renderGames(filter = "") {

  const query =
    filter.trim().toLowerCase();

  gamesEl.innerHTML = "";

  Object.entries(gamesData)
    .filter(([name]) =>
      name.toLowerCase().includes(query)
    )
    .forEach(([name, game]) => {

      const div =
        document.createElement("div");

      div.className = "game";

      if (selectedGame === name) {
        div.classList.add("active");
      }

      div.innerHTML = `
        <div class="game-icon">
          ${gameIcon(name)}
        </div>

        <div class="game-name">
          ${name}
        </div>

        <div class="game-currency">
          ${game.currency}
        </div>
      `;

      div.onclick = () =>
        selectGame(name);

      gamesEl.appendChild(div);
    });


  if (!gamesEl.children.length) {

    gamesEl.innerHTML =
      `<div class="muted">
        No game found.
      </div>`;
  }
}


function selectGame(name) {

  selectedGame = name;
  selectedProduct = null;

  renderGames(searchEl.value);
  renderPackages();

  updateSummary();
}


function renderPackages() {

  packagesEl.innerHTML = "";

  if (!selectedGame) {

    packagesEl.innerHTML =
      `<div class="muted">
        Select a game first.
      </div>`;

    return;
  }

  const game =
    gamesData[selectedGame];

  game.products.forEach(product => {

    const div =
      document.createElement("div");

    div.className = "package";

    if (
      selectedProduct &&
      selectedProduct.id === product.id
    ) {
      div.classList.add("active");
    }

    div.innerHTML = `
      <div class="package-name">
        💎 ${product.name}
      </div>

      <div class="price">
        ${formatPrice(product.price)}
      </div>
    `;

    div.onclick = () => {

      selectedProduct = product;

      renderPackages();
      updateSummary();
    };

    packagesEl.appendChild(div);
  });
}


function updateSummary() {

  if (
    !selectedGame ||
    !selectedProduct
  ) {

    summaryEl.style.display = "none";
    orderBtn.disabled = true;

    return;
  }

  summaryEl.style.display = "block";

  summaryEl.innerHTML = `
    <strong>Order Summary</strong>

    <br><br>

    Game:
    <strong>${selectedGame}</strong>

    <br>

    Package:
    <strong>${selectedProduct.name}</strong>

    <br>

    Price:
    <strong>${formatPrice(selectedProduct.price)}</strong>
  `;

  orderBtn.disabled =
    playerEl.value.trim().length === 0;
}


playerEl.addEventListener("input", () => {

  orderBtn.disabled =
    !selectedGame ||
    !selectedProduct ||
    playerEl.value.trim().length === 0;
});


searchEl.addEventListener("input", () => {

  renderGames(searchEl.value);
});


orderBtn.addEventListener("click", async () => {

  errorEl.textContent = "";
  resultEl.style.display = "none";

  if (
    !selectedGame ||
    !selectedProduct
  ) {
    return;
  }

  const playerId =
    playerEl.value.trim();

  const serverId =
    serverEl.value.trim();

  if (!playerId) {

    errorEl.textContent =
      "Please enter Player ID.";

    return;
  }

  orderBtn.disabled = true;
  orderBtn.textContent = "Creating Order...";

  try {

    const response =
      await fetch(`${API}/orders`, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          game: selectedGame,

          productId:
            selectedProduct.id,

          playerId,

          serverId
        })
      });


    const data =
      await response.json();


    if (!response.ok ||
        !data.success) {

      throw new Error(
        data.error ||
        "Unable to create order"
      );
    }


    const order =
      data.order;


    resultEl.style.display = "block";

    resultEl.innerHTML = `
      <strong>✅ Order Created</strong>

      <br><br>

      Order ID:
      <strong>${order.orderId}</strong>

      <br>

      Game:
      ${order.game}

      <br>

      Package:
      ${order.productName}

      <br>

      Price:
      ${formatPrice(order.price)}

      <br>

      Player ID:
      ${order.playerId}

      <br><br>

      Status:
      <strong>${order.status}</strong>

      <br><br>

      Payment is currently
      <strong>pending</strong>.
    `;


  } catch (error) {

    errorEl.textContent =
      error.message;

  } finally {

    orderBtn.disabled = false;
    orderBtn.textContent =
      "Create Order";

  }

});


loadGames();

</script></body>
</html>
